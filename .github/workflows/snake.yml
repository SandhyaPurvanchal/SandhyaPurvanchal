name: generate animation

on:
  # Har 24 ghante mein auto-run hoga
  schedule:
    - cron: "0 */24 * * *"
  
  # Manual run button bhi dega
  workflow_dispatch:
  
  # Jab bhi aap main branch par push karoge tab bhi chalega
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Snake animation SVG files generate karta hai
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            
      # Generated files ko 'output' branch mein push karta hai
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
